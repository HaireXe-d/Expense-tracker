<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="极简的个人收支记账小工具" />
  <title>Expense tracker</title>
  <link rel="icon" type="image/svg+xml" href="./image/logo.svg" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="wrap">
    <aside class="panel">
      <div class="topbar">
        <div class="avatar">
          <img src="./image/logo.svg" alt="Expense tracker" />
        </div>
        <h1 id="brandName" class="heading">
          Expense<span> tracker</span>
        </h1>
      </div>

      <section class="wallet">
        <h3>账户总览</h3>
        <p class="caption">当前余额</p>
        <div id="balTotal" class="grand">$0</div>

        <div class="split">
          <div>
            <p class="caption">总收入</p>
            <div id="balIn" class="gain">$0</div>
          </div>
          <div>
            <p class="caption">总支出</p>
            <div id="balOut" class="loss">$0</div>
          </div>
        </div>
      </section>

      <section class="entry">
        <h3>记一笔</h3>

        <form class="fields" id="entryForm">
          <div class="field">
            <label>类型</label>
            <select id="kind" name="kind">
              <option value="Income">收入</option>
              <option value="Expense">支出</option>
            </select>
          </div>

          <div class="field">
            <label>金额</label>
            <input type="text" placeholder="$ 0.00" id="money" name="money" />
          </div>

          <div class="field">
            <label>日期</label>
            <input type="date" id="day" name="day" />
          </div>

          <div class="field">
            <label>分类</label>
            <input type="text" placeholder="例如：工资、餐饮" id="tag" name="tag" />
          </div>

          <button type="submit" class="submit">保存</button>
        </form>
      </section>
    </aside>

    <div class="content">
      <main class="board">
        <h2>交易记录</h2>
        <ul class="records" id="recordList"></ul>
      </main>

      <section class="chart">
        <div class="chart-head">
          <h3>收支趋势</h3>
          <div class="legend">
            <span class="key"><i class="dot gain"></i>收入</span>
            <span class="key"><i class="dot loss"></i>支出</span>
          </div>
        </div>
        <div class="chart-body" id="chartBody"></div>
      </section>
    </div>
  </div>

  <footer class="foot">
    <div class="foot-inner">
      <div class="foot-left">
        <img class="foot-logo" src="./image/logo.svg" alt="logo" />
        <p class="foot-note">© 2026 Expense tracker · 保留所有权利</p>
